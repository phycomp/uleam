    title: 每週定期會議
    steps:
      - {step_id: "2-1", requirement: 週會排程, module: meeting_tracker, status: pending}
      - {step_id: "2-2", requirement: 會議記錄, module: meeting_tracker, status: pending}
      - {step_id: "2-3", requirement: 合規狀態追蹤, module: meeting_tracker, status: pending}
