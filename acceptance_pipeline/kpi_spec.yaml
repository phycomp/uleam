  - kpi_id: KPI-5
    title: 量測單位鏈結
    steps:
      - {step_id: "5-1", requirement: 盤點台灣量測單位, module: measurement-unit-link, status: done}
      - {step_id: "5-2", requirement: 聯繫洽詢, module: measurement-unit-link, status: done}
      - {step_id: "5-3", requirement: 試量測, module: measurement-unit-link, status: done}
      - {step_id: "5-4", requirement: 交叉比對, module: measurement-unit-link, status: done}